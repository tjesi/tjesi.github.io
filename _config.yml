# Site configuration for tjerandsilde.no
# This file is not reloaded by `jekyll serve`; restart the server after editing.

# Site settings
locale          : "en-US"
title           : "Tjerand Silde"
title_separator : "-"
name            : "Tjerand Silde"
description     : "Tjerand Silde is an Associate Professor in Cryptology at NTNU in Trondheim, Norway, working on lattice-based cryptography, zero-knowledge proofs, threshold signatures, and privacy-enhancing cryptography."
url             : "https://tjerandsilde.no"
baseurl         : ""
repository      : "tjesi/tjesi.github.io"
timezone        : Europe/Oslo

# Author (shown in the sidebar)
author:
  name          : "Tjerand Silde"
  avatar        : "tjerands.jpg"
  bio           : "Associate Professor in Cryptology"
  location      : "NTNU, Trondheim, Norway"
  uri           : "https://www.ntnu.edu/employees/tjerand.silde"
  email         : "tjerand.silde@ntnu.no"
  googlescholar : "https://scholar.google.no/citations?user=fWLrd9MAAAAJ&hl=en"
  orcid         : "https://orcid.org/0000-0002-5455-0409"
  github        : "tjesi"

# Reading files
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
keep_files:
  - .git
encoding: "utf-8"

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: archive
      author_profile: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# HTML compression (https://jch.penibelst.de/)
compress_html:
  clippings: all
  ignore:
    envs: development
